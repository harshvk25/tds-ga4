name: Daily Commit
on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 PM UTC daily
  workflow_dispatch:      # Allow manual runs

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Critical: Allows git push
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to fetch git history

      - name: Step with email 24ds2000078@ds.study.iitm.ac.in
        run: echo "Task by 24ds2000078@ds.study.iitm.ac.in"

      - name: Create commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "$(date)" > daily_commit.txt
          git add daily_commit.txt
          git commit -m "Daily automated commit ($(date))"
          git push
